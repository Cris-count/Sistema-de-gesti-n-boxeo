server:
  port: ${PORT:3001}

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:boxing_auth}${DB_SSL_SUFFIX:}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

boxing:
  jwt:
    secret: ${JWT_SECRET:boxing-super-secret}
  admin:
    email: ${ADMIN_EMAIL:admin@ringbox.local}
    password: ${ADMIN_PASSWORD:Admin123}
