services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: boxing_members
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmysql"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./backend/auth-service
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: boxing_auth
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: boxing-super-secret
      ADMIN_EMAIL: admin@ringbox.local
      ADMIN_PASSWORD: Admin123
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  members-service:
    build: ./backend/members-service
    environment:
      PORT: 3002
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: boxing_members
      DB_USER: root
      DB_PASSWORD: mysql
      JWT_SECRET: boxing-super-secret
    ports:
      - "3002:3002"
    depends_on:
      mysql:
        condition: service_healthy

  classes-service:
    build: ./backend/classes-service
    environment:
      PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: boxing_classes
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: boxing-super-secret
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      args:
        AUTH_API_URL: http://localhost:3001
        MEMBERS_API_URL: http://localhost:3002
        CLASSES_API_URL: http://localhost:3003
    environment:
      PORT: 4000
    ports:
      - "4200:4000"
    depends_on:
      - auth-service
      - members-service
      - classes-service

volumes:
  postgres-data:
  mysql-data:
